version: 2
project_name: styx

before:
  hooks:
    - go mod tidy

builds:
  - id: styx
    main: ./cmd/styx
    binary: styx
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

  - id: apple-container
    main: ./driver
    binary: apple-container
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w

archives:
  - id: styx-archive
    builds: [styx, apple-container]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: kessler-frost
    name: styx
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'

brews:
  - ids: [styx-archive]
    repository:
      owner: kessler-frost
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/kessler-frost/styx"
    description: "Personal cloud platform for macOS"
    license: "Apache-2.0"
    install: |
      bin.install "styx"
      (lib/"styx/plugins").install "apple-container"
    caveats: |
      The Nomad driver plugin has been installed to:
        #{lib}/styx/plugins/apple-container

      Configure Nomad to find it by adding to your Nomad config:
        plugin_dir = "#{lib}/styx/plugins"

      Or run 'styx init' which handles this automatically.
    test: |
      system "#{bin}/styx", "version"
